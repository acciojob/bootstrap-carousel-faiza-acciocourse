<!DOCTYPE html>

<html>

<head>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>

<body>

    <div id="myCarousel" class="carousel slide" data-ride="carousel">

        <div class="carousel-inner">

            <div class="item first-slide">
                <h2 class="text-center">First Slide</h2>
            </div>

            <div class="item second-slide">
                <h2 class="text-center">Second Slide</h2>
            </div>

            <div class="item third-slide active">
                <h2 class="text-center">Third Slide</h2>
            </div>

            <div class="item fourth-slide">
                <h2 class="text-center">Fourth Slide</h2>
            </div>

            <div class="item fifth-slide">
                <h2 class="text-center">Fifth Slide</h2>
            </div>

        </div>

        <a class="left carousel-control" href="#myCarousel" data-slide="prev">
            <span class="glyphicon glyphicon-chevron-left"></span>
        </a>

        <a class="right carousel-control" href="#myCarousel" data-slide="next">
            <span class="glyphicon glyphicon-chevron-right"></span>
        </a>

    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script src="./script.js"></script>

</body>

</html>
